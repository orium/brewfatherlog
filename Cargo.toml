[package]
name = "brewfatherlog"
description = "Log temperatures from grainfather fermenters to brewfather"
version = "0.1.8-pre"
authors = ["Diogo Sousa <diogogsousa@gmail.com>"]

edition = "2024"
rust-version = "1.91.0"

homepage = "https://github.com/orium/brewfatherlog"
repository = "https://github.com/orium/brewfatherlog"
documentation = "https://docs.rs/brewfatherlog"
readme = "README.md"

keywords = ["brewing", "fermentation", "grainfather", "brewfather", "logging"]

license = "MIT"

# What to include when packaging.
include = [
    "/src/**/*.rs",
    "/src/**/*.toml",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE.md",
    "/README.md",
    "/release-notes.md",
]

[dependencies]
dirs = "6.0.0"
humantime = "2.3.0"
log = { version = "0.4.33", features = [] }
reqwest = { version = "0.13.4", features = ["json", "cookies"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.150"
simplelog = "0.12.2"
thiserror = "2.0.18"
time = { version = "0.3.51", features = ["formatting"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
toml = "1.1.2"

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -2 }

enum_variant_names = "allow"
if_not_else = "allow"
inline_always = "allow"
match_bool = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_raw_string_hashes = "allow"
new_without_default = "allow"
partialeq_ne_impl = "allow"
similar_names = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
